<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
body { background: white; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.mjs';

const params = new URLSearchParams(location.search);
const pageNum = parseInt(params.get('page') || '1');
const scale = parseFloat(params.get('scale') || '2');

const pdf = await pdfjsLib.getDocument('DES570_JeremyLangdon_Portfolio_Build_Final_Touches.pdf').promise;
const page = await pdf.getPage(pageNum);
const viewport = page.getViewport({ scale });
const canvas = document.getElementById('c');
canvas.width = viewport.width;
canvas.height = viewport.height;
document.body.style.width = viewport.width + 'px';
document.body.style.height = viewport.height + 'px';
await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
document.title = 'DONE';
</script>
</body>
</html>
